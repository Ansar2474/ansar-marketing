name: Build site pages
on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'assets/projects/**'
      - 'scripts/**'
      - 'templates/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build pages from content
        run: node scripts/build.mjs
      - name: Save the rebuilt pages
        run: |
          git config user.name "Ansar site builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; else git commit -m "Rebuild pages from content" && git pull --rebase -q origin main && git push; fi
